name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ministatus
          POSTGRES_PASSWORD: ministatus
          POSTGRES_DB: ministatus
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ministatus -d ministatus"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://ministatus:ministatus@localhost:5432/ministatus?schema=public
      NODE_ENV: test
      PORT: 3000
      APP_VERSION: ci
      CORS_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run database migrations
        run: npm run prisma:deploy

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      VITE_API_URL: http://103.90.224.155:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tags
        id: meta
        run: |
          echo "backend=${{ secrets.DOCKERHUB_USERNAME }}/ministatus-backend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend=${{ secrets.DOCKERHUB_USERNAME }}/ministatus-frontend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        run: |
          docker build \
            -t "${{ steps.meta.outputs.backend }}" \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/ministatus-backend:latest" \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            --build-arg VITE_API_URL=http://103.90.224.155:3000 \
            -t "${{ steps.meta.outputs.frontend }}" \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/ministatus-frontend:latest" \
            ./frontend

      - name: Push backend image
        run: |
          docker push "${{ steps.meta.outputs.backend }}"
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/ministatus-backend:latest"

      - name: Push frontend image
        run: |
          docker push "${{ steps.meta.outputs.frontend }}"
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/ministatus-frontend:latest"