name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  # ============================================================
  # BACKEND CI
  # ============================================================
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ministatus
          POSTGRES_PASSWORD: ministatus
          POSTGRES_DB: ministatus
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ministatus -d ministatus"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://ministatus:ministatus@localhost:5432/ministatus?schema=public
      NODE_ENV: test
      PORT: 3000
      APP_VERSION: ci
      CORS_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Informational only for now.
      # Existing vulnerabilities currently require breaking upgrades.
      - name: Audit dependencies
        run: |
          npm audit --audit-level=high || {
            echo "::warning::Backend dependency audit reported vulnerabilities."
            echo "::warning::Review and upgrade dependencies separately."
          }

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run database migrations
        run: npm run prisma:deploy

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build


  # ============================================================
  # FRONTEND CI
  # ============================================================
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      VITE_API_URL: http://103.90.224.155:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Informational only for now.
      - name: Audit dependencies
        run: |
          npm audit --audit-level=high || {
            echo "::warning::Frontend dependency audit reported vulnerabilities."
            echo "::warning::Review and upgrade dependencies separately."
          }

      - name: Build
        run: npm run build


  # ============================================================
  # DOCKER BUILD
  # ============================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tags
        id: meta
        run: |
          echo "backend=${DOCKERHUB_USERNAME}/ministatus-backend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend=${DOCKERHUB_USERNAME}/ministatus-frontend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        run: |
          docker build \
            --pull \
            -t "${{ steps.meta.outputs.backend }}" \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            --pull \
            --build-arg VITE_API_URL="" \
            -t "${{ steps.meta.outputs.frontend }}" \
            ./frontend

      - name: Export backend image
        run: |
          docker save "${{ steps.meta.outputs.backend }}" \
            | gzip > ministatus-backend.tar.gz

      - name: Export frontend image
        run: |
          docker save "${{ steps.meta.outputs.frontend }}" \
            | gzip > ministatus-frontend.tar.gz

      - name: Upload Docker images
        uses: actions/upload-artifact@v4
        with:
          name: docker-images-${{ github.sha }}
          path: |
            ministatus-backend.tar.gz
            ministatus-frontend.tar.gz
          retention-days: 1


  # ============================================================
  # DOCKER SCAN
  # ============================================================
  docker-scan:
    name: Docker Scan
    runs-on: ubuntu-latest

    needs:
      - docker-build

    steps:
      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images-${{ github.sha }}

      - name: Load backend image
        run: |
          gunzip -c ministatus-backend.tar.gz | docker load

      - name: Load frontend image
        run: |
          gunzip -c ministatus-frontend.tar.gz | docker load

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.DOCKERHUB_USERNAME }}/ministatus-backend:${{ github.sha }}
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
          format: table

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.DOCKERHUB_USERNAME }}/ministatus-frontend:${{ github.sha }}
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
          format: table


  # ============================================================
  # DOCKER PUSH
  # ============================================================
  docker-push:
    name: Docker Push
    runs-on: ubuntu-latest

    needs:
      - docker-scan

    # Never push images from pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images-${{ github.sha }}

      - name: Load backend image
        run: |
          gunzip -c ministatus-backend.tar.gz | docker load

      - name: Load frontend image
        run: |
          gunzip -c ministatus-frontend.tar.gz | docker load

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Push immutable SHA tags first.
      - name: Push backend image
        run: |
          docker push \
            "${DOCKERHUB_USERNAME}/ministatus-backend:${GITHUB_SHA}"

      - name: Push frontend image
        run: |
          docker push \
            "${DOCKERHUB_USERNAME}/ministatus-frontend:${GITHUB_SHA}"

      # Update latest only after the immutable images were pushed.
      - name: Tag backend as latest
        run: |
          docker tag \
            "${DOCKERHUB_USERNAME}/ministatus-backend:${GITHUB_SHA}" \
            "${DOCKERHUB_USERNAME}/ministatus-backend:latest"

      - name: Tag frontend as latest
        run: |
          docker tag \
            "${DOCKERHUB_USERNAME}/ministatus-frontend:${GITHUB_SHA}" \
            "${DOCKERHUB_USERNAME}/ministatus-frontend:latest"

      - name: Push backend latest
        run: |
          docker push \
            "${DOCKERHUB_USERNAME}/ministatus-backend:latest"

      - name: Push frontend latest
        run: |
          docker push \
            "${DOCKERHUB_USERNAME}/ministatus-frontend:latest"