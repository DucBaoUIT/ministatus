name: Docker Release

on:
  workflow_call:

permissions:
  contents: write

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:

  # ============================================================
  # 1. BUILD IMAGES
  # ============================================================
  build:
    name: Build Docker Images

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image names
        id: meta
        run: |
          echo "backend=${DOCKERHUB_USERNAME}/ministatus-backend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend=${DOCKERHUB_USERNAME}/ministatus-frontend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        run: |
          docker build \
            --pull \
            -t "${{ steps.meta.outputs.backend }}" \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            --pull \
            --build-arg VITE_API_URL="" \
            -t "${{ steps.meta.outputs.frontend }}" \
            ./frontend

      # Export image để job scan/push dùng cùng image
      - name: Save backend image
        run: |
          docker save "${{ steps.meta.outputs.backend }}" \
            | gzip > ministatus-backend.tar.gz

      - name: Save frontend image
        run: |
          docker save "${{ steps.meta.outputs.frontend }}" \
            | gzip > ministatus-frontend.tar.gz

      - name: Upload Docker images
        uses: actions/upload-artifact@v4
        with:
          name: docker-images-${{ github.sha }}
          path: |
            ministatus-backend.tar.gz
            ministatus-frontend.tar.gz
          retention-days: 1


  # ============================================================
  # 2. SCAN IMAGES
  # ============================================================
  scan:
    name: Scan Docker Images

    runs-on: ubuntu-latest

    needs:
      - build

    steps:
      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images-${{ github.sha }}

      - name: Load backend image
        run: |
          gunzip -c ministatus-backend.tar.gz | docker load

      - name: Load frontend image
        run: |
          gunzip -c ministatus-frontend.tar.gz | docker load

      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.DOCKERHUB_USERNAME }}/ministatus-backend:${{ github.sha }}
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
          format: table

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.DOCKERHUB_USERNAME }}/ministatus-frontend:${{ github.sha }}
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
          format: table


  # ============================================================
  # 3. PUSH IMAGES
  # ============================================================
  push:
    name: Push Docker Images

    runs-on: ubuntu-latest

    needs:
      - scan

    steps:
      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images-${{ github.sha }}

      - name: Load backend image
        run: |
          gunzip -c ministatus-backend.tar.gz | docker load

      - name: Load frontend image
        run: |
          gunzip -c ministatus-frontend.tar.gz | docker load

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push backend image
        run: |
          docker push \
            "${DOCKERHUB_USERNAME}/ministatus-backend:${GITHUB_SHA}"

      - name: Push frontend image
        run: |
          docker push \
            "${DOCKERHUB_USERNAME}/ministatus-frontend:${GITHUB_SHA}"


  # ============================================================
  # 4. UPDATE GITOPS
  # ============================================================
  gitops:
    name: Update GitOps

    runs-on: ubuntu-latest

    needs:
      - push

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update backend image tag
        run: |
          sed -i \
            "/name: ${DOCKERHUB_USERNAME}\/ministatus-backend/{n;s/newTag:.*/newTag: ${GITHUB_SHA}/;}" \
            k8s/ministatus/kustomization.yaml

      - name: Update frontend image tag
        run: |
          sed -i \
            "/name: ${DOCKERHUB_USERNAME}\/ministatus-frontend/{n;s/newTag:.*/newTag: ${GITHUB_SHA}/;}" \
            k8s/ministatus/kustomization.yaml

      - name: Show GitOps changes
        run: |
          git diff -- k8s/ministatus/kustomization.yaml

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit GitOps update
        run: |
          git add k8s/ministatus/kustomization.yaml

          if git diff --cached --quiet; then
            echo "No GitOps changes."
            exit 0
          fi

          git commit \
            -m "chore(gitops): deploy ${GITHUB_SHA} [skip ci]"

      - name: Push GitOps update
        run: |
          git push origin HEAD:main