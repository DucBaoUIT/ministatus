apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ministatus-backend
  namespace: ministatus
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ministatus-backend

  minReplicas: 2
  maxReplicas: 5

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ministatus-frontend
  namespace: ministatus
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ministatus-frontend

  minReplicas: 2
  maxReplicas: 4

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
