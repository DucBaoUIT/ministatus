apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ministatus-backend
  namespace: ministatus
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ministatus-backend

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ministatus-frontend
  namespace: ministatus
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ministatus-frontend
