apiVersion: apps/v1
kind: Deployment
metadata:
  name: ministatus-backend
  namespace: ministatus
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: ministatus-backend

  template:
    metadata:
      labels:
        app: ministatus-backend

    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: backend
          image: 21520623/ministatus-backend:444368fcfb5e8086da12efdc956d947778dfcdfb
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000
              protocol: TCP

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ministatus-backend
                  key: DATABASE_URL

            - name: PORT
              value: "3000"

            - name: NODE_ENV
              value: production

            - name: APP_VERSION
              value: 444368fcfb5e8086da12efdc956d947778dfcdfb

            - name: CORS_ORIGIN
              value: https://ministatus.ducbao.space

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            failureThreshold: 30
            periodSeconds: 2

          readinessProbe:
            httpGet:
              path: /api/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: ministatus-backend
  namespace: ministatus
spec:
  type: ClusterIP
  selector:
    app: ministatus-backend
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
